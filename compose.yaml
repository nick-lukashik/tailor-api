# Local dependencies: pnpm infra:up | infra:down | infra:reset (drops data).
# Credentials are local-only placeholders; real ones come from the environment.
name: tailor-api

services:
    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
            POSTGRES_DB: app
        ports: ["5432:5432"]
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    postgres:
